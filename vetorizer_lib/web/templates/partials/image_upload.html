<div id="image-search-form" class="space-y-4">
    <!-- Database Selector -->
    <div>
        <label for="image_database_id" class="block text-sm font-medium text-gray-700 mb-2">
            Select Database <span class="text-red-500">*</span>
        </label>
        <select name="database_id" id="image_database_id" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            <option value="">Loading databases...</option>
        </select>
    </div>

    <!-- Image Upload -->
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            Upload Image <span class="text-red-500">*</span>
        </label>
        <div id="image-drop-zone" class="drop-zone border-2 border-dashed rounded-lg p-6 text-center cursor-pointer">
            <input type="file" name="image_file" id="image-file-input" accept=".jpg,.jpeg,.png,.webp,.gif" class="hidden" required>
            <div id="image-preview-container" class="hidden">
                <img id="image-preview" class="max-h-48 mx-auto rounded-lg mb-2" alt="Preview">
                <p id="image-file-name" class="text-sm text-gray-600"></p>
            </div>
            <div id="image-upload-placeholder">
                <svg class="w-12 h-12 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <p class="text-gray-600">Drop your image here or <span class="text-blue-600">browse</span></p>
                <p class="text-xs text-gray-400 mt-1">Supports JPG, PNG, WebP, GIF</p>
            </div>
        </div>
    </div>

    <!-- Result Limit -->
    <div>
        <label for="image_limit" class="block text-sm font-medium text-gray-700 mb-2">
            Max Results
        </label>
        <select name="limit" id="image_limit"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            <option value="5">5 results</option>
            <option value="10" selected>10 results</option>
            <option value="25">25 results</option>
        </select>
    </div>

    <!-- Submit Button -->
    <button type="button" id="image-search-btn"
            class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700 transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
            disabled>
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Search by Image
    </button>
</div>

<script>
    const imageDropZone = document.getElementById('image-drop-zone');
    const imageFileInput = document.getElementById('image-file-input');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const imageFileName = document.getElementById('image-file-name');
    const imagePlaceholder = document.getElementById('image-upload-placeholder');
    const imageSearchBtn = document.getElementById('image-search-btn');

    // Click to browse
    imageDropZone.addEventListener('click', () => imageFileInput.click());

    // Drag and drop
    imageDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        imageDropZone.classList.add('drag-over');
    });

    imageDropZone.addEventListener('dragleave', () => {
        imageDropZone.classList.remove('drag-over');
    });

    imageDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        imageDropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length) {
            imageFileInput.files = e.dataTransfer.files;
            handleImageSelect(e.dataTransfer.files[0]);
        }
    });

    // File input change
    imageFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleImageSelect(e.target.files[0]);
        }
    });

    function handleImageSelect(file) {
        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
            imagePreview.src = e.target.result;
            imagePreviewContainer.classList.remove('hidden');
            imagePlaceholder.classList.add('hidden');
            imageFileName.textContent = file.name;
            imageSearchBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }

    // Image search button click
    imageSearchBtn.addEventListener('click', async () => {
        const databaseId = document.getElementById('image_database_id').value;
        const file = imageFileInput.files[0];
        const limit = document.getElementById('image_limit').value;

        if (!databaseId || !file) {
            showToast('Please select a database and upload an image', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('database_ids', databaseId);
        formData.append('limit', limit);

        // Show loading state
        const resultsSection = document.getElementById('search-results');
        const resultsContainer = document.getElementById('results-container');
        resultsSection.classList.remove('hidden');
        resultsContainer.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';

        try {
            const response = await fetch('/api/search/image', {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'Image search failed');
            }

            const data = await response.json();
            displayResults(data);

        } catch (error) {
            resultsContainer.innerHTML = `
                <div class="text-center py-8 text-red-500">
                    <p>Error: ${error.message}</p>
                </div>
            `;
        }
    });

    // Load databases for image search
    async function loadImageDatabases() {
        const select = document.getElementById('image_database_id');
        
        try {
            const response = await fetch('/api/databases');
            if (!response.ok) throw new Error('Failed to load databases');
            
            const databases = await response.json();
            
            select.innerHTML = '<option value="">Select a database...</option>';
            
            databases.forEach(db => {
                if (db.status === 'READY') {
                    select.innerHTML += `<option value="${db.id}">${db.name} (${db.document_count} docs)</option>`;
                }
            });
            
        } catch (error) {
            select.innerHTML = '<option value="">Error loading databases</option>';
        }
    }

    // Load databases when this script runs
    loadImageDatabases();
</script>
