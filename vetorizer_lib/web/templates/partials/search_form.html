<form id="search-form" class="space-y-4">
    <!-- Database Selector -->
    <div>
        <label for="database_id" class="block text-sm font-medium text-gray-700 mb-2">
            Select Database <span class="text-red-500">*</span>
        </label>
        <select name="database_id" id="database_id" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            <option value="">Loading databases...</option>
        </select>
    </div>

    <!-- Query Input -->
    <div>
        <label for="query" class="block text-sm font-medium text-gray-700 mb-2">
            Search Query <span class="text-red-500">*</span>
        </label>
        <input type="text" name="query" id="query" required
               placeholder="Enter your search query..."
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        <p class="text-xs text-gray-500 mt-1">Enter natural language text to find similar content</p>
    </div>

    <!-- Result Limit -->
    <div>
        <label for="limit" class="block text-sm font-medium text-gray-700 mb-2">
            Max Results
        </label>
        <select name="limit" id="limit"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            <option value="5">5 results</option>
            <option value="10" selected>10 results</option>
            <option value="25">25 results</option>
            <option value="50">50 results</option>
        </select>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        Search
    </button>
</form>

<script>
    // Load databases on page load
    async function loadDatabases() {
        const select = document.getElementById('database_id');
        
        try {
            const response = await fetch('/api/databases');
            if (!response.ok) throw new Error('Failed to load databases');
            
            const databases = await response.json();
            
            select.innerHTML = '<option value="">Select a database...</option>';
            
            if (databases.length === 0) {
                select.innerHTML = '<option value="">No databases available - create one first</option>';
                return;
            }
            
            databases.forEach(db => {
                if (db.status === 'READY') {
                    select.innerHTML += `<option value="${db.id}">${db.name} (${db.document_count} docs)</option>`;
                }
            });

            // Check for URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const dbParam = urlParams.get('db');
            if (dbParam) {
                select.value = dbParam;
            }
            
        } catch (error) {
            select.innerHTML = '<option value="">Error loading databases</option>';
            console.error('Error loading databases:', error);
        }
    }

    // Load databases when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadDatabases);
    } else {
        loadDatabases();
    }
</script>
