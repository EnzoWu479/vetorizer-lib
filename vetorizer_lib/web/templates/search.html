{% extends "base.html" %}

{% block title %}Vetorizer - Search{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Search Vector Database</h1>
    
    <div class="grid grid-cols-1 gap-8">
        <!-- Search Form with Tabs -->
        <div class="bg-white rounded-lg shadow-md">
            <!-- Tab Navigation -->
            <div class="flex border-b">
                <button id="text-tab" onclick="switchTab('text')"
                        class="flex-1 py-3 px-4 text-center font-medium border-b-2 border-blue-600 text-blue-600">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    Text Search
                </button>
                <button id="image-tab" onclick="switchTab('image')"
                        class="flex-1 py-3 px-4 text-center font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                    <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    Image Search
                </button>
            </div>
            
            <!-- Tab Content -->
            <div class="p-6">
                <div id="text-search-panel">
                    {% include "partials/search_form.html" %}
                </div>
                <div id="image-search-panel" class="hidden">
                    {% include "partials/image_upload.html" %}
                </div>
            </div>
        </div>
        
        <!-- Search Results -->
        <div id="search-results" class="bg-white rounded-lg shadow-md p-6 hidden">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Results</h2>
            <div id="results-container">
                <!-- Results will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
    function switchTab(tab) {
        const textTab = document.getElementById('text-tab');
        const imageTab = document.getElementById('image-tab');
        const textPanel = document.getElementById('text-search-panel');
        const imagePanel = document.getElementById('image-search-panel');
        
        if (tab === 'text') {
            textTab.classList.add('border-blue-600', 'text-blue-600');
            textTab.classList.remove('border-transparent', 'text-gray-500');
            imageTab.classList.remove('border-blue-600', 'text-blue-600');
            imageTab.classList.add('border-transparent', 'text-gray-500');
            textPanel.classList.remove('hidden');
            imagePanel.classList.add('hidden');
        } else {
            imageTab.classList.add('border-blue-600', 'text-blue-600');
            imageTab.classList.remove('border-transparent', 'text-gray-500');
            textTab.classList.remove('border-blue-600', 'text-blue-600');
            textTab.classList.add('border-transparent', 'text-gray-500');
            imagePanel.classList.remove('hidden');
            textPanel.classList.add('hidden');
        }
    }
</script>
{% endblock %}

{% block scripts %}
<script>
    const searchForm = document.getElementById('search-form');
    const resultsSection = document.getElementById('search-results');
    const resultsContainer = document.getElementById('results-container');

    searchForm?.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const databaseId = formData.get('database_id');
        const query = formData.get('query');
        const limit = formData.get('limit') || 10;

        if (!databaseId || !query) {
            showToast('Please select a database and enter a query', 'error');
            return;
        }

        // Show loading state
        resultsSection.classList.remove('hidden');
        resultsContainer.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';

        try {
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    database_ids: [databaseId],
                    query_type: 'text',
                    query_content: query,
                    limit: parseInt(limit),
                }),
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'Search failed');
            }

            const data = await response.json();
            displayResults(data);

        } catch (error) {
            resultsContainer.innerHTML = `
                <div class="text-center py-8 text-red-500">
                    <p>Error: ${error.message}</p>
                </div>
            `;
        }
    });

    function displayResults(data) {
        if (data.total_results === 0) {
            resultsContainer.innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <p>No results found. Try a different query.</p>
                </div>
            `;
            return;
        }

        let html = `
            <div class="text-sm text-gray-500 mb-4">
                Found ${data.total_results} results in ${data.query_time_ms}ms
            </div>
            <div class="space-y-4">
        `;

        for (const [dbId, results] of Object.entries(data.results)) {
            for (const result of results) {
                const scoreClass = result.score >= 0.8 ? 'score-high' : result.score >= 0.5 ? 'score-medium' : 'score-low';
                html += `
                    <div class="border rounded-lg p-4 card-hover">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs text-gray-500">${result.database_name}</span>
                            <span class="px-2 py-1 text-xs rounded ${scoreClass}">
                                ${(result.score * 100).toFixed(1)}%
                            </span>
                        </div>
                        <p class="text-gray-800">${escapeHtml(result.content)}</p>
                        ${result.metadata ? `<div class="mt-2 text-xs text-gray-400">${JSON.stringify(result.metadata)}</div>` : ''}
                    </div>
                `;
            }
        }

        html += '</div>';
        resultsContainer.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
{% endblock %}
