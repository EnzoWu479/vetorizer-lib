{% extends "base.html" %}

{% block title %}Vetorizer - Home{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Vector Database Management</h1>
        <button onclick="openCreateDatabaseModal()" class="px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium flex items-center gap-2">
            <span class="text-lg">➕</span> Create New Database
        </button>
    </div>
    
    <!-- Database List -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Your Databases</h2>
        <div id="database-list"
             hx-get="/api/databases"
             hx-trigger="load, databaseCreated from:body"
             hx-swap="innerHTML">
            <div class="flex justify-center py-8">
                <div class="spinner"></div>
            </div>
        </div>
    </div>
</div>

<!-- Create Database Modal -->
{% include "partials/create_database_modal.html" %}
{% endblock %}

{% block scripts %}
<script>
    // Handle database list response
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.pathInfo.requestPath === '/api/databases') {
            const databases = JSON.parse(evt.detail.xhr.responseText);
            const container = document.getElementById('database-list');
            
            if (databases.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
                        </svg>
                        <p>No databases yet. Upload a CSV to get started!</p>
                    </div>
                `;
            } else {
                container.innerHTML = databases.map(db => `
                    <div class="border rounded-lg p-4 mb-3 card-hover">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-medium text-gray-800">${db.name}</h3>
                                <p class="text-sm text-gray-500">${db.document_count} documents</p>
                            </div>
                            <span class="px-2 py-1 text-xs rounded ${db.status === 'READY' ? 'bg-green-100 text-green-800' : db.status === 'CREATING' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}">
                                ${db.status}
                            </span>
                        </div>
                        <p class="text-xs text-gray-400 mt-2">Created: ${new Date(db.created_at).toLocaleDateString()}</p>
                    </div>
                `).join('');
            }
        }
    });

    // Show upload modal
    function showUploadModal() {
        document.getElementById('upload-modal').classList.remove('hidden');
        document.getElementById('upload-modal').classList.add('flex');
    }

    // Hide upload modal
    function hideUploadModal() {
        document.getElementById('upload-modal').classList.add('hidden');
        document.getElementById('upload-modal').classList.remove('flex');
    }

    // Handle upload form submission
    document.getElementById('upload-form')?.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        showUploadModal();
        
        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'Upload failed');
            }
            
            const job = await response.json();
            
            // Start SSE for progress updates
            const eventSource = new EventSource(`/api/upload/${job.id}/progress`);
            
            eventSource.addEventListener('progress', function(e) {
                const data = JSON.parse(e.data.replace(/'/g, '"'));
                updateProgress(data.percent, data.processed);
            });
            
            eventSource.addEventListener('completed', function(e) {
                eventSource.close();
                updateProgress(100, 0);
                setTimeout(() => {
                    hideUploadModal();
                    showToast('Database created successfully!', 'success');
                    document.body.dispatchEvent(new CustomEvent('databaseCreated'));
                    document.getElementById('upload-form').reset();
                    document.getElementById('column-selector').classList.add('hidden');
                }, 500);
            });
            
            eventSource.addEventListener('error', function(e) {
                eventSource.close();
                hideUploadModal();
                showToast('Upload failed: ' + (e.data || 'Unknown error'), 'error');
            });
            
        } catch (error) {
            hideUploadModal();
            showToast(error.message, 'error');
        }
    });

    function updateProgress(percent, processed) {
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        if (progressBar) progressBar.style.width = percent + '%';
        if (progressText) progressText.textContent = `${percent}% complete`;
    }
</script>
{% endblock %}
